services:
  # PostgreSQL 数据库
  shiyu-postgres:
    image: postgres:15
    container_name: shiyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiyu_admin_scaffold
      POSTGRES_USER: shiyu
      POSTGRES_PASSWORD: shiyu123
    ports:
      - "15432:5432"
    volumes:
      - shiyu-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiyu -d shiyu_admin_scaffold"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiyu-network

  # Redis 缓存
  shiyu-redis:
    image: redis:7
    container_name: shiyu-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - shiyu-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiyu-network

  # 单一应用容器：Nginx 提供前端并代理 API 到同容器内的 Go 后端
  shiyu-app:
    image: ${SHIYU_IMAGE:-ghcr.io/rodert/shiyuadmin:latest}
    container_name: shiyu-app
    restart: unless-stopped
    ports:
      - "18000:80"
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=configs/config.docker.yaml
    depends_on:
      shiyu-postgres:
        condition: service_healthy
      shiyu-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/api/v1/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shiyu-network

  # 前端 CI / 本地校验：不随 up 启动（profile: ci）。在仓库根目录执行例如：
  #   docker compose --profile ci run --rm shiyu-frontend-ci sh -lc "npm install --legacy-peer-deps && npm run lint"
  #   docker compose --profile ci run --rm shiyu-frontend-ci sh -lc "npm install --legacy-peer-deps && npm run build"
  # 若本机已有与 Linux 兼容的 node_modules，可省略 install，直接 npm run lint。
  shiyu-frontend-ci:
    profiles: ["ci"]
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend/shiyu-admin-web:/app
    environment:
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    networks:
      - shiyu-network

networks:
  shiyu-network:
    driver: bridge

volumes:
  shiyu-pg-data:
    driver: local
  shiyu-redis-data:
    driver: local
