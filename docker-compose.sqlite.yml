services:
  shiyu-app:
    image: ${SHIYU_IMAGE:-ghcr.io/rodert/shiyuadmin:latest}
    container_name: shiyu-app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SHIYU_JWT_SECRET: ${SHIYU_JWT_SECRET:-}
      CONFIG_FILE: configs/config.sqlite.yaml
    ports:
      - "18000:80"
    volumes:
      - shiyu-sqlite-data:/data
      - shiyu-app-data:/app/data

volumes:
  shiyu-app-data:
  shiyu-sqlite-data:
