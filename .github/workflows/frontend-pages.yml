name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'img/**'
      - 'frontend/shiyu-admin-web/public/logo.png'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure git auth for GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Prepare static site
        run: |
          rm -rf site-dist
          mkdir -p site-dist/assets
          cp site/index.html site-dist/index.html
          cp site/styles.css site-dist/styles.css
          cp frontend/shiyu-admin-web/public/logo.png site-dist/assets/logo.png
          cp img/login-img.png site-dist/assets/login-img.png
          cp img/home-img.png site-dist/assets/home-img.png
          cp img/dashboard.png site-dist/assets/dashboard.png

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-dist
          publish_branch: gh-pages
          force_orphan: true
